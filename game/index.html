<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sizzle &amp; Serve — a tiny kitchen rush game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1c130c; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { display: block; width: min(100vw, 177.78vh); height: min(100vh, 56.25vw);
          background: #2a1d12; touch-action: none; image-rendering: auto; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden;
            clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"
    aria-label="Sizzle and Serve: run the kitchen, chop and grill ingredients, plate dishes and serve orders before the timer runs out"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
